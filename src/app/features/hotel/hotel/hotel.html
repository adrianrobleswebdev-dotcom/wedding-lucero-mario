<div class="w-full flex flex-col items-center gap-4 pt-16 px-6 bg-[#eae4cc] min-h-[800px] pb-0">

    <!-- Título HOSPEDAJE -->
    <h2
        class="text-[#8d6f40] uppercase text-center text-[3.7rem] font-[500] font-['Cormorant_Garamond',_Georgia,_serif] tracking-[-0.1em]">
        HOSPEDAJE
    </h2>

    <!-- Hacienda Santo Cristo -->
    <div class="flex flex-col items-center gap-3 mb-[1rem]">
        <p class="text-[#8d6f40] uppercase text-center md:text-[1.2rem] sm:text-sm"
            style="font-family: 'Cormorant Garamond', 'Georgia', serif; font-weight: 400; letter-spacing: 0.18em;">
            HACIENDA SANTO CRISTO
        </p>
        <a href="https://maps.app.goo.gl/cKe6NmASn584XXwD8"
            target="_blank"
            rel="noopener noreferrer"
            class="px-5 py-2 border border-[#8d6f40] text-[#8d6f40] uppercase tracking-widest text-xs sm:text-sm hover:bg-[#8d6f40] hover:text-white transition-all duration-300"
            style="font-family: 'Cormorant Garamond', 'Georgia', serif; letter-spacing: 0.2em;">
            VER UBICACIÓN
        </a>
    </div>

    <!-- Hotel Boutique La Rioja -->
    <div class="flex flex-col items-center gap-3 mb-[1rem]">
        <p class="text-[#8d6f40] uppercase text-center md:text-[1.2rem] sm:text-sm"
            style="font-family: 'Cormorant Garamond', 'Georgia', serif; font-weight: 400; letter-spacing: 0.18em;">
            HOTEL BOUTIQUE LA RIOJA
        </p>
        <a href="https://maps.app.goo.gl/sEm1u8dSpkPF9ZVR7"
            target="_blank"
            rel="noopener noreferrer"
            class="px-5 py-2 border border-[#8d6f40] text-[#8d6f40] uppercase tracking-widest text-xs sm:text-sm hover:bg-[#8d6f40] hover:text-white transition-all duration-300"
            style="font-family: 'Cormorant Garamond', 'Georgia', serif; letter-spacing: 0.2em;">
            VER UBICACIÓN
        </a>
    </div>

    <!-- Hotel Calandrias -->
    <div class="flex flex-col items-center gap-3">
        <p class="text-[#8d6f40] uppercase text-center md:text-[1.2rem] sm:text-sm"
            style="font-family: 'Cormorant Garamond', 'Georgia', serif; font-weight: 400; letter-spacing: 0.18em;">
            HOTEL CALANDRIAS
        </p>
        <a href="https://maps.app.goo.gl/jBWZrhqmet499khz5"
            target="_blank"
            rel="noopener noreferrer"
            class="px-5 py-2 border border-[#8d6f40] text-[#8d6f40] uppercase tracking-widest text-xs sm:text-sm hover:bg-[#8d6f40] hover:text-white transition-all duration-300"
            style="font-family: 'Cormorant Garamond', 'Georgia', serif; letter-spacing: 0.2em;">
            VER UBICACIÓN
        </a>
    </div>

    <!-- Imágenes agrupadas sin espacio intermedio -->
    <div class="w-full md:max-w-6xl flex flex-col items-center">
        <img class="hospedaje-img" [src]="hotelIMG" alt="Hotel">
        <img class="hospedaje-img" [src]="hotelNewIMG" alt="Hotel">
    </div>



</div>
