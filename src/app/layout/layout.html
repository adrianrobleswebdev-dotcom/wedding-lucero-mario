<!-- Botón Reproductor de Música Flotante -->
<button (click)="togglePlay(weddingAudio)"
        class="fixed top-6 right-6 z-50 flex items-center justify-center w-12 h-12 rounded-full border border-[#8d6f40] bg-[#eae4cc]/85 backdrop-blur-sm text-[#8d6f40] shadow-[0_4px_20px_rgba(141,111,64,0.15)] hover:bg-[#8d6f40] hover:text-white transition-all duration-300 active:scale-95 focus:outline-none"
        aria-label="Reproducir música">
    @if (isPlaying) {
        <!-- Pause Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
            <path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 0 1 .75-.75H9a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75H7.5a.75.75 0 0 1-.75-.75V5.25Zm7.5 0A.75.75 0 0 1 15 4.5h1.5a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75H15a.75.75 0 0 1-.75-.75V5.25Z" clip-rule="evenodd" />
        </svg>
    } @else {
        <!-- Play Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 translate-x-[1.5px]">
            <path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.33 2.779-1.643l11.54 6.347c1.295.712 1.295 2.573 0 3.286L7.28 19.99c-1.25.687-2.779-.217-2.779-1.643V5.653Z" clip-rule="evenodd" />
        </svg>
    }
</button>

<audio #weddingAudio [src]="audioSrc" loop></audio>
