<div class="w-full bg-[#8d6f40] py-8 sm:py-10 flex flex-col items-center gap-7 sm:gap-10">


    <!-- Imagen de dress code -->
    <div class="img-container flex justify-center items-center w-full mt-2">
        <img class="w-[55%] sm:w-[35%] md:w-[25%] lg:w-[20%] object-cover" [src]="dressCodeIMG" alt="">
    </div>



    <!-- Título principal -->
    <div class="text-center px-6">
        <h2 class="text-white uppercase tracking-tight leading-tight"
            style="font-family: 'Cormorant Garamond', 'Georgia', serif; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 300; ">
            CÓDIGO DE<br>VESTIMENTA
        </h2>
        <!-- Palabra "formal" en cursiva -->
        <div class="text-center mt-[20px]">
            <span class="text-white italic"
                style="font-family: 'Dancing Script', 'Brush Script MT', cursive; font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 400;">
                formal
            </span>
        </div>
    </div>



    <!-- Íconos y texto -->
    <div class="flex flex-col items-center gap-5 sm:gap-6 mt-2">
        <div class="flex justify-center gap-10 sm:gap-16 md:gap-24">
            <img class="w-14 h-14 sm:w-16 sm:h-16 md:w-20 md:h-20 object-contain" src="/pictures/dress.svg" alt="Mujeres largo">
            <img class="w-14 h-14 sm:w-16 sm:h-16 md:w-20 md:h-20 object-contain" src="/pictures/suit.svg" alt="Hombres traje">
        </div>
        <p class="text-white text-center font-normal tracking-wide text-base sm:text-lg md:text-xl">
            Mujeres largo / Hombres traje
        </p>
    </div>

</div>
