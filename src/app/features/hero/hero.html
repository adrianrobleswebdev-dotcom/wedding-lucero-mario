<!-- Hero Section -->
<section class="hero-container" data-purpose="hero-container">

  <!-- Background Image with Overlay -->
  <div class="hero-bg">
    <img
      alt="Lucero and Mario"
      class="hero-bg-img"
      [src]="background"
    />
    <!-- Dark overlay -->
    <div class="hero-overlay"></div>
  </div>


  <div class="logo-container relative z-10" >
    <img [src]="logo" class="w-full h-auto max-w-[175px] translate-y-[-200px]" alt="">

  </div>

</section>
